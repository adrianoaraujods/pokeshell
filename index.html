<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="./styles/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap"
    />
  </head>

  <body>
    <main class="pokedex">
      <img class="shell" src="assets/shell.svg" />

      <div class="pokedex__left">
        <div class="visor">
          <img class="visor" src="./assets/visor.svg" />

          <div class="visor__content">
            <div class="visor__column">
              <section id="main-screen" class="screen screen--main">
                <p class="loading">Loading...</p>
              </section>

              <div class="visor__row">
                <button id="LANG" class="button button--round" type="button">
                  Language
                </button>

                <figure class="grill">
                  <rect></rect>
                  <rect></rect>
                  <rect></rect>
                  <rect></rect>
                </figure>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="pokedex__right"></div>
    </main>
  </body>
</html>
