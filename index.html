<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="./styles/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap"
    />
  </head>

  <body>
    <main class="pokedex">
      <img class="shell" src="assets/shell.svg" />
      <img class="lights" src="assets/lights.svg" />

      <div class="pokedex__left">
        <div class="visor">
          <img class="visor__img" src="./assets/visor.svg" />

          <div class="visor__content">
            <div class="visor__column">
              <section class="screen screen--main" data-active="true">
                <div id="main-screen" class="window"></div>
              </section>

              <div class="visor__row">
                <button id="LANG" class="button button--round" type="button">
                  Language
                </button>

                <figure class="grill">
                  <rect></rect>
                  <rect></rect>
                  <rect></rect>
                  <rect></rect>
                </figure>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="CONFIRM" class="button button--round" type="button">
            Confirm
          </button>

          <div class="controls__column">
            <div class="controls__row">
              <button id="BACK" class="button button--pill" type="button">
                Back
              </button>

              <button id="TAB" class="button button--pill" type="button">
                Tab
              </button>
            </div>

            <section class="screen screen--info" data-active="true">
              <div id="info-screen" class="window"></div>
            </section>
          </div>

          <div class="d-pad">
            <img class="d-pad__img" src="./assets/dpad.svg" />
            <button id="D-UP" class="d-pad__button" type="button">Up</button>
            <button id="D-LEFT" class="d-pad__button" type="button">
              Left
            </button>
            <button id="D-RIGHT" class="d-pad__button" type="button">
              Right
            </button>
            <button id="D-DOWN" class="d-pad__button" type="button">
              Down
            </button>
          </div>
        </div>
      </div>

      <div class="pokedex__right">
        <section class="screen screen--secondary">
          <div id="secondary-screen" class="window"></div>
        </section>

        <div class="keyboard">
          <button id="KEY-0" class="button button--square">0</button>
          <button id="KEY-1" class="button button--square">1</button>
          <button id="KEY-2" class="button button--square">2</button>
          <button id="KEY-3" class="button button--square">3</button>
          <button id="KEY-7" class="button button--square">7</button>
          <button id="KEY-4" class="button button--square">4</button>
          <button id="KEY-5" class="button button--square">5</button>
          <button id="KEY-6" class="button button--square">6</button>
          <button id="KEY-8" class="button button--square">8</button>
          <button id="KEY-9" class="button button--square">9</button>
        </div>

        <div class="screen-buttons">
          <button id="LEFT" class="button button--pill" type="button">
            Left
          </button>

          <button id="RIGHT" class="button button--pill" type="button">
            Right
          </button>
        </div>

        <div class="aux-buttons">
          <button id="L" class="button button--square">L</button>
          <button id="R" class="button button--square">R</button>

          <img src="./assets/light.svg" />
        </div>

        <div class="type-screens">
          <section class="screen screen--type">
            <div id="type-screen-1" class="window"></div>
          </section>
          <section class="screen screen--type">
            <div id="type-screen-2" class="window"></div>
          </section>
        </div>
      </div>
    </main>

    <script src="./javascript/utils.js" defer></script>
    <script src="./javascript/locale.js" defer></script>
    <script src="./javascript/api.js" defer></script>
    <script src="./javascript/types.js" defer></script>
    <script src="./javascript/generations.js" defer></script>
    <script src="./javascript/screens.js" defer></script>
    <script src="./javascript/grid.js" defer></script>
    <script src="./javascript/search.js" defer></script>
    <script src="./javascript/readout.js" defer></script>
    <script src="./javascript/controls.js" defer></script>
    <script src="./javascript/script.js" defer></script>
  </body>
</html>
